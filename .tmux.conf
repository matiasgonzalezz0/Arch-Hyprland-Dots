# Switch prefix to CTRL + A
unbind C-b
set-option -g prefix C-a

# Start windows and panes at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Enable mouse (don't judge me)
set -g mouse on

# Sane defaults
set -sg escape-time 0
set -g history-limit 50000
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -g set-clipboard on
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# C-a r      reload this config
bind r source-file ~/.tmux.conf \; display "reloaded"

# Windows
# C-a c      new window (in current dir)
# C-a C-a    jump to last window
# C-a a      send a literal C-a to the program
# Alt+1..5   jump to window 1-5 (no prefix)
bind c new-window -c "#{pane_current_path}"
bind a send-prefix
bind C-a last-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Built-in keys worth remembering
# C-a w      window/session picker
# C-a ,      rename window
# C-a s      list sessions
# C-a d      detach (tmux a to come back)
# C-a [      copy mode (vi keys, v to select, y to copy)

# Status bar (uses terminal colors, so it follows wallust via kitty)
set -g status-position top
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=blue,bold] #S  "
set -g status-left-length 30
set -g status-right ""
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=black,bg=blue,bold] #I #W "
set -g message-style "bg=default,fg=yellow"
