# wallust 4.0-alpha
# Migrated from v3 config (original kept at wallust-old.toml).
# Docs: https://explosion-mental.codeberg.page/wallust/v4.html

# How the image is read/downscaled before color extraction.
# options: "full", "resized", "wal", "thumb", "fast-resize"
# NOTE: "kmeans" is no longer a backend in v4 -- it is a palette (see below).
backend = "full"

# v4 replaced the v3 scheme names (dark/dark16/harddark/softlight/...) with a
# palette *algorithm* plus a light/dark style.
# palette options:
#  * salience - weights colors by how much they stand out (v4 default, was `dark`)
#  * ansi     - maps the image onto standard ANSI color slots
#  * kmeans   - k-means clustering over the image's colors
palette = "salience"

# Background/foreground orientation. options: "dark", "light"
style = "dark"

# Difference between similar colors when picking the palette:
#  1          Not perceptible by human eyes.
#  1 - 2      Perceptible through close observation.
#  2 - 10     Perceptible at a glance.
#  11 - 49    Colors are more similar than opposite
#  100        Colors are exact opposite
threshold = 10

# NOTE: `color_space` was removed in v4 and is gone from this config.
# NOTE: do NOT add `<name>.pywal = true` to the templates below -- these
#       templates use v4's `{{color0}}` syntax; pywal mode expects `{color0}`
#       and would emit the placeholders literally.

[templates]
cava.template = 'colors-cava'
cava.target = '~/.config/cava/config'

hypr.template = 'colors-hyprland.conf'
hypr.target = '~/.config/hypr/wallust/wallust-hyprland.conf'

rofi.template = 'colors-rofi.rasi'
rofi.target = '~/.config/rofi/wallust/colors-rofi.rasi'

waybar.template = 'colors-waybar.css'
waybar.target = '~/.config/waybar/wallust/colors-waybar.css'

kitty.template = 'colors-kitty.conf'
kitty.target = '~/.config/kitty/kitty.conf'

swaync.template = 'colors-swaync.css'
swaync.target = '~/.config/swaync/wallust/colors-wallust.css'

#macchina.template = 'templates/colors-macchina.toml'
#macchina.target = '~/.config/macchina/themes/wallust.toml'

#wezterm.template = 'templates/colors-wezterm.toml'
#wezterm.target = '~/.config/wezterm/colors/wallust.toml'

